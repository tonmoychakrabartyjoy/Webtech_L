<!DOCTYPE html>
<html>
    <head>
        <title>Club Registration</title>
    </head>
    <body>
        <style>
            #club-registration {
                width: 350px;
                margin: 0 auto;
                margin-top: 50px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            #btnRegister {
                
                margin: 0 auto;
            }
        </style>
        <div id="club-registration">
            <h1>Register Your Club</h1>
            <form id="form-vali" onsubmit="return formValidation(event)" action="#">
                <label for="fname">Name </label>
                <input type="text" id="fname" name="name"><br><br>

                <label for="sid">AIUB ID </label>
                <input type="text" id="sid" name="id" pattern="[0-9]{2}-[0-9]{5}-[0-9]{1}" placeholder="22-12345-2"><br><br>

                <label for="email">Email </label>
                <input type="email" id="email" name="email"><br><br>

                <label for="age">Age </label>
                <input type="number" id="age" name="age" step="1" min="16" max="60"><br><br>

                <label for="pass">Password </label>
                <input type="password" id="pass" name="password"><br><br>

                <label for="pass2">Confirm Password </label>
                <input type="password" id="pass2" name="confirmPassword"><br><br>

                <button type="submit" id="btnRegister" >Register</button><br><br><br>

                <span id="error"></span>
            </form>

            <script>
                function formValidation(event){
                    event.preventDefault();

                    let nameval = document.getElementById("fname").value;
                    let id = document.getElementById("sid").value;
                    let email = document.getElementById("email").value;
                    let age = document.getElementById("age").value;
                    let pass = document.getElementById("pass").value;
                    let pass2 = document.getElementById("pass2").value;

                    document.getElementById("error").style.color = "red";

                    if(nameval == ""){
                        document.getElementById("error").innerText = "Name is required";
                        return false;
                    }
                    if(nameval.length < 3){
                        document.getElementById("error").innerText = "Name must be at least 3 characters long";
                        return false;
                    }

                    if(id == ""){
                        document.getElementById("error").innerText = "AIUB ID is required";
                        return false;
                    }

                    if(email.indexOf("@") == -1 || email.indexOf(".") == -1){
                        document.getElementById("error").innerText = "Email is not valid";
                        return false;
                    }

                    if(age <16 || age > 60){
                        document.getElementById("error").innerText = "Age must be between 16 and 60";
                        return false;
                    }

                    if(pass == ""){
                        document.getElementById("error").innerText = "Password is required";
                        return false;
                    }

                    if(pass.length < 6){
                        document.getElementById("error").innerText = "Password must be at least 6 characters long";
                        return false;
                    }

                    if(pass2 == ""){
                        document.getElementById("error").innerText = "Confirm Password is required";
                        return false;
                    }

                    if(pass != pass2){
                        document.getElementById("error").innerText = "Password do not match";
                        return false;
                    }

                    let message = "Registration successfull. welcome, ";
                    message += nameval;
                    message += "!";

                    document.getElementById("error").style.color = "green";
                    document.getElementById("error").innerText = message;
                    document.getElementById("form-vali").reset();
                    
                    return true;
                };
            </script>

        </div>
    </body>
</html>
